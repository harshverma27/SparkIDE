<!DOCTYPE html>
<!--
  blockly/index.html — Local HTML page that hosts the Google Blockly editor.
  This page is loaded inside a QWebEngineView in main_window.py.

  What to do here:

  1. LOAD BLOCKLY
     Load Blockly from the local vendor files (preferred for offline use) or CDN:
       <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
       <script src="https://unpkg.com/blockly/msg/en.js"></script>
     Then load our custom block definitions and generators:
       <script src="blocks/arduino_blocks.js"></script>
       <script src="generators/arduino_generator.js"></script>

  2. LOAD QWEBCHANNEL
     PyQt6-WebEngine injects qwebchannel.js automatically.
     In your init script, connect to the Python bridge:
       new QWebChannel(qt.webChannelTransport, function(channel) {
           window.bridge = channel.objects.bridge;
       });

  3. INITIALISE BLOCKLY WORKSPACE
     Call Blockly.inject('blocklyDiv', { toolbox: TOOLBOX_XML })
     where TOOLBOX_XML is a string of XML defining the toolbox categories.
     Categories to include (matching arduino_blocks.js):
       - Arduino Structure  (setup/loop)
       - Digital I/O        (pinMode, digitalWrite, digitalRead)
       - Time               (delay)
       - Logic              (if/else — reuse Blockly built-ins)
       - Variables          (int, bool variable blocks)
       - Serial             (Serial.begin, Serial.print)

  4. LISTEN FOR WORKSPACE CHANGES
     workspace.addChangeListener(function(event) {
         if (event.isUiEvent) return;      // ignore pure UI events (scroll, zoom)
         var code = ArduinoGenerator.workspaceToCode(workspace);
         if (window.bridge) {
             bridge.on_code_update(code);  // send C++ string to Python
         }
     });

  5. EXPOSE loadWorkspace() FOR PYTHON → JS CALLS
     window.loadWorkspace = function(jsonStr) {
         var state = JSON.parse(jsonStr);
         Blockly.serialization.workspaces.load(state, workspace);
     };
     Python calls this via: page.runJavaScript("loadWorkspace(" + json + ")")

  6. EXPOSE getWorkspaceJson() FOR SAVE
     window.getWorkspaceJson = function() {
         return JSON.stringify(Blockly.serialization.workspaces.save(workspace));
     };
     Python calls this via: page.runJavaScript("getWorkspaceJson()", callback)

  STYLING NOTES:
  - The #blocklyDiv should fill the entire window (width: 100%, height: 100vh).
  - Background: dark theme is preferred (matches the app's dark palette).
  - You can pass a theme to Blockly.inject: theme: Blockly.Themes.Dark
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SparkIDE Blockly</title>
  <style>
    /* TODO: make #blocklyDiv fill the whole viewport */
    html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; }
    #blocklyDiv { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>

  <!-- TODO: Add Blockly script tags here -->
  <!-- TODO: Add arduino_blocks.js and arduino_generator.js script tags -->
  <!-- TODO: Add QWebChannel init + workspace change listener script -->
</body>
</html>
