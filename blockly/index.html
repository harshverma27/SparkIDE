<!DOCTYPE html>
<!--
  blockly/index.html — Local Blockly host page loaded inside QWebEngineView.
  Script load order matters:
    1. qrc:///qtwebchannel/qwebchannel.js  — Qt bridge
    2. blockly_compressed.js + msg/en.js   — Blockly core
    3. arduino_blocks.js                   — Custom block shapes
    4. arduino_generator.js                — C++ generators
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SparkIDE Blockly</title>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/msg/en.js"></script>
  <script src="blocks/arduino_blocks.js"></script>
  <script src="generators/arduino_generator.js"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
    #blocklyDiv { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>

  <script>
    // ── Toolbox ──────────────────────────────────────────────────────────────
    const TOOLBOX = {
      kind: 'categoryToolbox',
      contents: [

        // ── Structure ────────────────────────────────────────────────────────
        {
          kind: 'category', name: '⚙  Structure', colour: '120',
          contents: [
            { kind: 'block', type: 'arduino_setup_loop' }
          ]
        },

        // ── Digital I/O ──────────────────────────────────────────────────────
        {
          kind: 'category', name: '💡  Digital I/O', colour: '210',
          contents: [
            { kind: 'block', type: 'arduino_pinmode' },
            { kind: 'block', type: 'arduino_digitalwrite' },
            // digitalRead is an expression block — plug it into Logic > if or Compare
            { kind: 'block', type: 'arduino_digitalread' }
          ]
        },

        // ── Analog I/O ───────────────────────────────────────────────────────
        {
          kind: 'category', name: '📈  Analog I/O', colour: '160',
          contents: [
            { kind: 'block', type: 'arduino_analogread' },
            { kind: 'block', type: 'arduino_analogwrite' },
            { kind: 'block', type: 'arduino_map' }
          ]
        },

        // ── Time ─────────────────────────────────────────────────────────────
        {
          kind: 'category', name: '⏱  Time', colour: '30',
          contents: [
            { kind: 'block', type: 'arduino_delay' },
            { kind: 'block', type: 'arduino_delay_microseconds' },
            { kind: 'block', type: 'arduino_millis' }
          ]
        },

        // ── Logic (Blockly built-ins with custom Arduino generators) ─────────
        {
          kind: 'category', name: '🔀  Logic', colour: '210',
          contents: [
            // if / if-else — drag digitalRead or analogRead into the condition socket
            { kind: 'block', type: 'controls_if' },
            // Comparison: ==, !=, <, <=, >, >=
            {
              kind: 'block', type: 'logic_compare',
              fields: { OP: 'EQ' }
            },
            // AND / OR
            { kind: 'block', type: 'logic_operation' },
            // NOT
            { kind: 'block', type: 'logic_negate' },
            // true / false literal
            { kind: 'block', type: 'logic_boolean' }
          ]
        },

        // ── Loops (Blockly built-ins) ─────────────────────────────────────────
        {
          kind: 'category', name: '🔁  Loops', colour: '120',
          contents: [
            { kind: 'block', type: 'controls_whileUntil' },
            {
              kind: 'block', type: 'controls_for',
              fields: { VAR: 'i' },
              inputs: {
                FROM: { shadow: { type: 'math_number', fields: { NUM: 0 } } },
                TO:   { shadow: { type: 'math_number', fields: { NUM: 9 } } },
                BY:   { shadow: { type: 'math_number', fields: { NUM: 1 } } }
              }
            }
          ]
        },

        // ── Math (Blockly built-ins) ──────────────────────────────────────────
        {
          kind: 'category', name: '🔢  Math', colour: '230',
          contents: [
            { kind: 'block', type: 'math_number' },
            { kind: 'block', type: 'math_arithmetic' }
          ]
        },

        // ── Variables ────────────────────────────────────────────────────────
        {
          kind: 'category', name: '📦  Variables', colour: '330',
          contents: [
            // Fixed literal: int name = 0;
            { kind: 'block', type: 'arduino_variable_int' },
            // Expression socket: int name = [digitalRead / analogRead / math...]
            { kind: 'block', type: 'arduino_variable_int_expr' },
            // Reassign existing variable: name = [any block]
            { kind: 'block', type: 'arduino_variable_assign' },
            { kind: 'block', type: 'arduino_variable_bool' }
          ]
        },

        // ── Serial ───────────────────────────────────────────────────────────
        {
          kind: 'category', name: '📡  Serial', colour: '270',
          contents: [
            { kind: 'block', type: 'arduino_serial_begin' },
            { kind: 'block', type: 'arduino_serial_print' },
            { kind: 'block', type: 'arduino_serial_println' }
          ]
        }
      ]
    };

    // ── Initial workspace: pre-place the setup/loop container ────────────────
    const INITIAL_STATE = {
      blocks: {
        languageVersion: 0,
        blocks: [{ type: 'arduino_setup_loop', x: 40, y: 40 }]
      }
    };

    // ── Main init ────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {

      const workspace = Blockly.inject('blocklyDiv', {
        toolbox: TOOLBOX,
        theme:   Blockly.Themes.Dark,
        grid: { spacing: 24, length: 4, colour: '#2a2a2a', snap: true },
        trashcan:   true,
        scrollbars: true,
        zoom: { controls: true, wheel: true, startScale: 0.9, maxScale: 3, minScale: 0.3 }
      });

      Blockly.serialization.workspaces.load(INITIAL_STATE, workspace);

      // ── Generate & send C++ to Python ────────────────────────────────────
      function generateAndSend() {
        try {
          var code = ArduinoGenerator.workspaceToCode(workspace);
          if (!code || code.trim() === '') {
            code = '// Place blocks inside setup() or loop() to generate code.';
          }
          if (window.bridge) {
            window.bridge.on_code_update(code);
          }
        } catch (err) {
          console.error('[SparkIDE] Code generation error:', err);
        }
      }

      // ── Connect QWebChannel bridge ───────────────────────────────────────
      function connectBridge(attempts) {
        if (typeof QWebChannel === 'undefined' || typeof qt === 'undefined') {
          if (attempts > 0) setTimeout(function () { connectBridge(attempts - 1); }, 150);
          else console.error('[SparkIDE] Bridge connection failed.');
          return;
        }
        new QWebChannel(qt.webChannelTransport, function (channel) {
          window.bridge = channel.objects.bridge;
          console.log('[SparkIDE] Python bridge connected.');
          generateAndSend();
        });
      }
      connectBridge(10);

      // ── Workspace change → update code panel ────────────────────────────
      workspace.addChangeListener(function (event) {
        if (event.isUiEvent) return;
        generateAndSend();
      });

      // ── Public API for Python (called via page.runJavaScript) ────────────
      window.loadWorkspace = function (jsonStr) {
        try { Blockly.serialization.workspaces.load(JSON.parse(jsonStr), workspace); }
        catch (e) { console.error('[SparkIDE] loadWorkspace error:', e); }
      };
      window.getWorkspaceJson = function () {
        return JSON.stringify(Blockly.serialization.workspaces.save(workspace));
      };
      window.clearWorkspace = function () {
        workspace.clear();
        Blockly.serialization.workspaces.load(INITIAL_STATE, workspace);
      };
    });
  </script>
</body>
</html>
