<!DOCTYPE html>
<!--
  blockly/index.html — Local Blockly host page loaded inside QWebEngineView.
  Script load order matters:
    1. qrc:///qtwebchannel/qwebchannel.js  — Qt bridge
    2. blockly_compressed.js + msg/en.js   — Blockly core
    3. arduino_blocks.js                   — Custom block shapes
    4. arduino_generator.js                — C++ generators
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SparkIDE Blockly</title>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/blockly_compressed.js"></script>
  <script src="vendor/blocks_compressed.js"></script>
  <script src="vendor/en.js"></script>
  <script src="blocks/arduino_blocks.js"></script>
  <script src="generators/arduino_generator.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f0c;
      --panel: rgba(16, 21, 18, 0.94);
      --panel-strong: rgba(13, 19, 16, 0.98);
      --panel-soft: rgba(22, 32, 27, 0.92);
      --border: #22322a;
      --border-strong: #3c5347;
      --text: #e4f0e8;
      --text-soft: #93a89c;
      --text-dim: #5c7468;
      --accent: #4ade80;
      --accent-soft: rgba(74, 222, 128, 0.18);
      --success: #4ade80;
      --warning: #f0a93e;
      --shadow: 0 18px 40px rgba(1, 6, 4, 0.38);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background:
        repeating-linear-gradient(0deg, rgba(74, 222, 128, 0.025) 0px, rgba(74, 222, 128, 0.025) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at top left, rgba(74, 222, 128, 0.10), transparent 28%),
        radial-gradient(circle at bottom right, rgba(240, 169, 62, 0.08), transparent 30%),
        linear-gradient(180deg, #0c130f 0%, #080c0a 100%);
      font-family: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", monospace;
      color: var(--text);
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 14px;
    }

    .workspace-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(16, 21, 18, 0.96), rgba(10, 15, 12, 0.94));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .workspace-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.02), transparent 24%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent 12%);
    }

    .workspace-stage {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      border: 1px solid rgba(60, 83, 71, 0.42);
      border-radius: 6px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(14, 20, 17, 0.92), rgba(9, 13, 11, 0.98));
    }

    #blocklyDiv {
      width: 100%;
      height: 100%;
    }

    .blocklyToolboxDiv {
      border-right: 1px solid rgba(60, 83, 71, 0.4) !important;
      background: linear-gradient(180deg, rgba(9, 13, 11, 0.98), rgba(16, 21, 18, 0.98)) !important;
    }

    .blocklyTreeRow {
      margin: 6px 10px !important;
      padding: 10px 12px !important;
      border: 1px solid transparent !important;
      border-radius: 6px !important;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .blocklyTreeRow:hover {
      background: rgba(74, 222, 128, 0.1) !important;
      border-color: rgba(60, 83, 71, 0.5) !important;
      transform: translateX(2px);
    }

    .blocklyTreeSelected {
      background: rgba(74, 222, 128, 0.18) !important;
      border-color: rgba(74, 222, 128, 0.42) !important;
    }

    .blocklyTreeLabel {
      color: var(--text) !important;
      font-size: 12px !important;
      font-weight: 600 !important;
    }

    .blocklyFlyout,
    .blocklyScrollbarBackground {
      fill: rgba(9, 13, 11, 0.98) !important;
    }

    .blocklyFlyoutButtonBackground {
      fill: #16201b !important;
      stroke: #3c5347 !important;
    }

    .blocklyMainBackground {
      stroke: transparent !important;
    }

    .blocklyScrollbarHandle {
      fill: rgba(60, 83, 71, 0.7) !important;
    }

    .blocklyZoom > image,
    .blocklyTrash > image {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="workspace-shell">
    <div class="workspace-stage">
      <div id="blocklyDiv"></div>
    </div>
  </div>

  <script>
    const TOOLBOX = {
      kind: "categoryToolbox",
      contents: [
        {
          kind: "category", name: "Structure", colour: "140",
          contents: [
            { kind: "block", type: "arduino_setup_loop" }
          ]
        },
        {
          kind: "category", name: "Digital I/O", colour: "185",
          contents: [
            { kind: "block", type: "arduino_pinmode" },
            { kind: "block", type: "arduino_digitalwrite" },
            { kind: "block", type: "arduino_digitalread" },
            { kind: "block", type: "arduino_pin_toggle" },
            { kind: "separator" },
            { kind: "block", type: "arduino_led_blink" },
            { kind: "separator" },
            { kind: "block", type: "arduino_button_pressed" }
          ]
        },
        {
          kind: "category", name: "Analog I/O", colour: "185",
          contents: [
            { kind: "block", type: "arduino_analogread" },
            { kind: "block", type: "arduino_analogwrite" },
            { kind: "block", type: "arduino_map" },
            { kind: "block", type: "arduino_constrain" }
          ]
        },
        {
          kind: "category", name: "Time", colour: "42",
          contents: [
            { kind: "block", type: "arduino_delay" },
            { kind: "block", type: "arduino_delay_microseconds" },
            { kind: "block", type: "arduino_millis" },
            { kind: "block", type: "arduino_micros" }
          ]
        },
        {
          kind: "category", name: "Logic", colour: "222",
          contents: [
            { kind: "block", type: "controls_if" },
            { kind: "block", type: "logic_compare", fields: { OP: "EQ" } },
            { kind: "block", type: "logic_operation" },
            { kind: "block", type: "logic_negate" },
            { kind: "block", type: "logic_boolean" }
          ]
        },
        {
          kind: "category", name: "Loops", colour: "140",
          contents: [
            { kind: "block", type: "controls_whileUntil" },
            {
              kind: "block", type: "controls_for",
              fields: { VAR: "i" },
              inputs: {
                FROM: { shadow: { type: "math_number", fields: { NUM: 0 } } },
                TO: { shadow: { type: "math_number", fields: { NUM: 9 } } },
                BY: { shadow: { type: "math_number", fields: { NUM: 1 } } }
              }
            },
            { kind: "block", type: "arduino_do_while" },
            { kind: "separator" },
            { kind: "block", type: "arduino_break" },
            { kind: "block", type: "arduino_continue" }
          ]
        },
        {
          kind: "category", name: "Math", colour: "42",
          contents: [
            { kind: "block", type: "math_number" },
            { kind: "block", type: "math_arithmetic" },
            { kind: "block", type: "arduino_math_modulo" },
            { kind: "separator" },
            { kind: "block", type: "arduino_math_abs" },
            { kind: "block", type: "arduino_math_sqrt" },
            { kind: "block", type: "arduino_math_pow" },
            { kind: "block", type: "arduino_math_round" },
            { kind: "separator" },
            { kind: "block", type: "arduino_math_random" },
            { kind: "block", type: "arduino_math_min" },
            { kind: "block", type: "arduino_math_max" }
          ]
        },
        {
          kind: "category", name: "Variables", colour: "222",
          contents: [
            { kind: "block", type: "arduino_variable_int" },
            { kind: "block", type: "arduino_variable_int_expr" },
            { kind: "block", type: "arduino_variable_float" },
            { kind: "block", type: "arduino_variable_bool" },
            { kind: "block", type: "arduino_variable_string" },
            { kind: "separator" },
            { kind: "block", type: "arduino_variable_get" },
            { kind: "block", type: "arduino_variable_assign" },
            { kind: "block", type: "arduino_variable_compound" }
          ]
        },
        {
          kind: "category", name: "Serial", colour: "185",
          contents: [
            { kind: "block", type: "arduino_serial_begin" },
            { kind: "separator" },
            { kind: "block", type: "arduino_serial_print" },
            { kind: "block", type: "arduino_serial_println" },
            { kind: "block", type: "arduino_serial_print_expr" },
            { kind: "block", type: "arduino_serial_println_expr" },
            { kind: "separator" },
            { kind: "block", type: "arduino_serial_available" },
            { kind: "block", type: "arduino_serial_read" },
            { kind: "block", type: "arduino_serial_flush" }
          ]
        }
      ]
    };

    const INITIAL_STATE = {
      blocks: {
        languageVersion: 0,
        blocks: [{ type: "arduino_setup_loop", x: 40, y: 40 }]
      }
    };

    const WORKSPACE_THEME = Blockly.Theme.defineTheme("sparkide", {
      base: Blockly.Themes.Dark,
      componentStyles: {
        workspaceBackgroundColour: "#101512",
        toolboxBackgroundColour: "#0a0f0c",
        toolboxForegroundColour: "#e4f0e8",
        flyoutBackgroundColour: "#101512",
        flyoutForegroundColour: "#e4f0e8",
        flyoutOpacity: 1,
        scrollbarColour: "#3c5347",
        insertionMarkerColour: "#f0a93e",
        insertionMarkerOpacity: 0.4,
        scrollbarOpacity: 0.8,
        cursorColour: "#e4f0e8",
        blackBackground: "#080c0a"
      },
      blockStyles: {
        logic_blocks: { colourPrimary: "222" },
        loop_blocks: { colourPrimary: "140" },
        math_blocks: { colourPrimary: "42" },
        variable_blocks: { colourPrimary: "222" }
      },
      fontStyle: {
        family: "Inter, Segoe UI, sans-serif",
        weight: "600",
        size: 12
      },
      startHats: true
    });

    document.addEventListener("DOMContentLoaded", function () {
      const workspace = Blockly.inject("blocklyDiv", {
        toolbox: TOOLBOX,
        theme: WORKSPACE_THEME,
        renderer: "zelos",
        move: {
          scrollbars: {
            horizontal: true,
            vertical: true
          },
          drag: true,
          wheel: true
        },
        grid: { spacing: 26, length: 3, colour: "#1a2620", snap: true },
        trashcan: true,
        zoom: { controls: true, wheel: true, startScale: 0.88, maxScale: 2.4, minScale: 0.35, scaleSpeed: 1.12 }
      });

      Blockly.serialization.workspaces.load(INITIAL_STATE, workspace);

      function updateWorkspaceMeta() {
        const count = workspace.getAllBlocks(false).length;
        if (window.bridge && window.bridge.on_block_count_update) {
          window.bridge.on_block_count_update(count);
        }
      }

      function generateAndSend() {
        try {
          let code = ArduinoGenerator.workspaceToCode(workspace);
          if (!code || code.trim() === "") {
            code = "// Place blocks inside setup() or loop() to generate code.";
          }
          if (window.bridge) {
            window.bridge.on_code_update(code);
          }
          updateWorkspaceMeta();
        } catch (err) {
          console.error("[SparkIDE] Code generation error:", err);
        }
      }

      function connectBridge(attempts) {
        if (typeof QWebChannel === "undefined" || typeof qt === "undefined") {
          if (attempts > 0) {
            setTimeout(function () { connectBridge(attempts - 1); }, 150);
          } else {
            console.error("[SparkIDE] Bridge connection failed.");
          }
          return;
        }
        new QWebChannel(qt.webChannelTransport, function (channel) {
          window.bridge = channel.objects.bridge;
          generateAndSend();
        });
      }

      workspace.addChangeListener(function (event) {
        if (event.isUiEvent) {
          return;
        }
        generateAndSend();
      });

      window.centerWorkspace = function () {
        workspace.scrollCenter();
      };

      window.zoomToFitWorkspace = function () {
        workspace.zoomToFit();
      };

      window.loadWorkspace = function (jsonStr) {
        try {
          Blockly.serialization.workspaces.load(JSON.parse(jsonStr), workspace);
          updateWorkspaceMeta();
        } catch (e) {
          console.error("[SparkIDE] loadWorkspace error:", e);
        }
      };

      window.getWorkspaceJson = function () {
        return JSON.stringify(Blockly.serialization.workspaces.save(workspace));
      };

      window.clearWorkspace = function () {
        workspace.clear();
        Blockly.serialization.workspaces.load(INITIAL_STATE, workspace);
        updateWorkspaceMeta();
      };

      updateWorkspaceMeta();
      connectBridge(10);
    });
  </script>
</body>
</html>
