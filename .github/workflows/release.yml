name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Run the test suites before publishing anything ────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 \
            libnss3 libnspr4 libxdamage1 libxcomposite1 libxrandr2 \
            libxtst6 libgbm1 libxshmfence1
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Python tests
        run: xvfb-run -a python -m pytest tests/ -q
      - name: JS tests
        run: node --test tests/

      # ── Extract the matching CHANGELOG section as release notes ───────────
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting notes for version $VERSION"
          # Print lines between "## [VERSION]" and the next "## [" header.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for $VERSION; using a placeholder." >&2
            echo "Release $GITHUB_REF_NAME. See CHANGELOG.md for details." > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SparkIDE ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
